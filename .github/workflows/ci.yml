name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs this whole suite on the tagged commit before publishing.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      # The launcher tests build cpa-launcher (launcher/, pure Go) in vitest's global setup;
      # Windows does not use the launcher.
      - uses: actions/setup-go@v6
        if: runner.os != 'Windows'
        with:
          go-version-file: launcher/go.mod
          cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Lifecycle tests must not be skipped (Windows)
        if: runner.os == 'Windows'
        shell: bash
        working-directory: packages/cpa
        run: |
          pnpm vitest run tests/unit/lifecycle.test.ts --reporter=json --outputFile=lifecycle.json
          node -e "const r = require('./lifecycle.json'); if (r.numPendingTests || r.numTodoTests) { console.error('lifecycle tests were skipped'); process.exit(1); }"
      - run: pnpm build

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Every published workspace package shares one version.
      - run: node scripts/versions.ts
      # The existing tree predates Biome formatting, so this checks new examples only.
      - run: pnpm format:check
      - uses: actions/setup-go@v6
        with:
          go-version-file: launcher/go.mod
          cache: false
      - name: go vet (launcher)
        working-directory: launcher
        run: |
          for os in linux darwin freebsd openbsd netbsd; do GOOS=$os go vet ./...; done
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

  e2e:
    name: e2e against CPA (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # musl is the portable build; gnu is the plugin-enabled build.
        target: [linux-x64-musl, linux-x64-gnu]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - id: cpa
        run: node --input-type=module -e "import { CPA_RELEASE } from './packages/cpa/src/server/cpa-version.ts'; console.log('go=' + CPA_RELEASE.goVersion)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.cpa.outputs.go }}
          cache: false
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build-binary.ts --target ${{ matrix.target }}
      - run: node scripts/verify-binary.ts --target ${{ matrix.target }} --smoke
      - run: pnpm panel:fetch
      - run: pnpm test:e2e
        env:
          CPA_BINARY: ${{ github.workspace }}/dist-bin/${{ matrix.target }}/cli-proxy-api

  e2e-windows:
    name: e2e against CPA (win32-x64)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - id: cpa
        run: node --input-type=module -e "import { CPA_RELEASE } from './packages/cpa/src/server/cpa-version.ts'; console.log('go=' + CPA_RELEASE.goVersion)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.cpa.outputs.go }}
          cache: false
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build-binary.ts --target win32-x64
      - run: node scripts/verify-binary.ts --target win32-x64 --smoke
      - run: pnpm panel:fetch
      - run: pnpm test:e2e
        env:
          CPA_BINARY: ${{ github.workspace }}/dist-bin/win32-x64/cli-proxy-api.exe

  bun:
    name: unit tests under bun
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      # The launcher tests build cpa-launcher (launcher/, pure Go) in vitest's global setup.
      - uses: actions/setup-go@v6
        with:
          go-version-file: launcher/go.mod
          cache: false
      - run: pnpm install --frozen-lockfile
      - run: bun --bun vitest run
        working-directory: packages/cpa
      - run: bun --bun vitest run
        working-directory: packages/codex-auth
